services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: go_voting
      MYSQL_USER: ${MYSQL_USER:-osivote}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-osivote_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ADDR: :8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      DB_DSN: ${MYSQL_USER:-osivote}:${MYSQL_PASSWORD:-osivote_dev}@tcp(mysql:3306)/go_voting?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27
      AUTO_MIGRATE: "true"
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET wajib diisi}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_TTL: ${SESSION_TTL:-12h}
      SCHOOL_NAME: ${SCHOOL_NAME:?SCHOOL_NAME wajib diisi}
      SCHOOL_SLUG: ${SCHOOL_SLUG:-}
      SCHOOL_EMAIL: ${SCHOOL_EMAIL:-}
      SCHOOL_ADDRESS: ${SCHOOL_ADDRESS:-}
      SCHOOL_PHONE: ${SCHOOL_PHONE:-}
      SCHOOL_WEBSITE: ${SCHOOL_WEBSITE:-}
      ADMIN_NAME: ${ADMIN_NAME:-Panitia OSIS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME wajib diisi}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diisi}
      SEED_DEMO: ${SEED_DEMO:-false}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
  uploads:
